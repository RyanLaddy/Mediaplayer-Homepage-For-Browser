<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121212;
    --panel: #1a1a1a;
    --ink: #ededed;
    --dim: #8c8c8c;
    --line: #2e2e2e;
    --s: calc(min(44vmin, 340px) * var(--k, 1));
    --peek: .5; --bgc: #161616;
    --shadow: .5; --gloss: .6; --radius: 4px; --label: 36%; --tsize: 1; --gapk: 1; --sw: 560px;
    --vig: .3; --grain: 0; --persp: 1100px; --depth: 24; --accent: #ededed; --vc: #0e0e0e;
    --sh: 48px; --sr: 10px; --so: .7; --sb: 0px; --cz: 1; --ls: 46px; --nw: 220px; --nh: 110px; --no: .55; --tw: 600;
    --gp: 7px; --ga: .06; --cs: .34; --cdh: 0deg; --mk: .45; --shine: 1; --sp: .55;
    --spin: 3.2s;
    --blur: 70px;
    --font: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
  html, body { height: 100%; background: var(--bg); }
  body { color: var(--ink); font-family: var(--font); overflow: hidden; }

  #page { position: fixed; inset: 0; overflow-x: hidden; overflow-y: auto; }
  .bg {
    position: absolute; inset: -12%;
    background: var(--bg) center / cover;
    filter: blur(var(--blur)) saturate(1.2);
  }
  .veil { position: absolute; inset: 0; background: #000; opacity: .45; }
  body.no-blur .bg { display: none; }

  main {
    position: relative; min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    gap: calc(clamp(40px, 7vw, 110px) * var(--gapk));
    padding: 110px 6vw 40px;
  }

  /* sleeve + vinyl */
  .deck { position: relative; width: calc(var(--s) * (1 + var(--peek))); height: var(--s); flex: none; }
  .sleeve {
    position: absolute; inset: 0 auto auto 0; z-index: 2;
    width: var(--s); height: var(--s); border-radius: var(--radius);
    background: #262626 center / cover;
    box-shadow: 0 24px 60px rgba(0,0,0,var(--shadow));
  }
  .disc { position: absolute; top: 0; left: calc(var(--s) * var(--peek)); width: var(--s); height: var(--s); z-index: 1; }
  .record {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle, transparent 0 38%, rgba(0,0,0,.6) 38.4%, transparent 39.3%, transparent 52%, rgba(0,0,0,.5) 52.3%, transparent 53%,
        transparent 65%, rgba(0,0,0,.5) 65.3%, transparent 66%, transparent 78%, rgba(0,0,0,.5) 78.3%, transparent 79%),
      repeating-radial-gradient(circle, rgba(255,255,255,0) 0, rgba(255,255,255,var(--ga)) calc(var(--gp) / 2), rgba(255,255,255,0) var(--gp)),
      radial-gradient(circle, color-mix(in srgb, var(--vc) 82%, white) 0, var(--vc) 75%);
    animation: spin var(--spin) linear infinite;
  }
  body.no-spin .record, body.only-play.idle .record { animation-play-state: paused; }
  body.rev .record { animation-direction: reverse; }
  body.solid .bg { background-image: var(--bgi, none) !important; background-size: cover; background-position: center; background-color: var(--bgc); filter: none; }
  body.solid .veil { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sheen {
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 20deg, transparent 0 8%, rgba(255,255,255,.09) 14%, transparent 22%, transparent 55%, rgba(255,255,255,.07) 64%, transparent 72%);
  }
  .label {
    position: absolute; top: 50%; left: 50%; width: var(--label); aspect-ratio: 1; translate: -50% -50%;
    border-radius: 50%; background: #3a3a3a center / cover;
  }
  .label::after {
    content: ""; position: absolute; top: 50%; left: 50%; width: 7%; aspect-ratio: 1; translate: -50% -50%;
    border-radius: 50%; background: var(--bg);
  }
  body.no-vinyl .disc { display: none; }
  body.no-vinyl .deck, body.no-cover .deck { width: var(--s); }
  body.no-cover .sleeve { display: none; }
  body.no-cover .disc { left: 0; }

  /* text */
  .info { max-width: 460px; min-width: 0; }
  .status { font-size: .9rem; color: var(--dim); margin-bottom: 14px; }
  h1 { font-weight: var(--tw); font-size: calc(clamp(2.1rem, 4.6vw, 3.6rem) * var(--tsize)); line-height: 1.05; letter-spacing: -.025em; text-wrap: balance; }
  .artist { font-size: 1.25rem; margin-top: 14px; }
  .album { color: var(--dim); margin-top: 4px; }
  body.no-text .info { display: none; }
  body.no-status .status { display: none; }

  /* search */
  .search {
    position: absolute; top: 28px; left: 50%; translate: -50% 0; z-index: 5;
    width: min(var(--sw), 90vw); height: var(--sh); padding: 0 16px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(18,18,18,var(--so)); backdrop-filter: blur(var(--sb)); border: 1px solid transparent; border-radius: var(--sr);
  }
  .search:focus-within { background: rgba(18,18,18,calc(var(--so) + .12)); }
  body.sb-on .search { border-color: #3a3a3a; }
  body.sb-on .search:focus-within { border-color: #777; }
  .search svg { flex: none; width: 17px; height: 17px; stroke: var(--dim); fill: none; stroke-width: 2; stroke-linecap: round; }
  .search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; color: var(--ink); font: inherit; }
  .search input::placeholder { color: var(--dim); }
  .search input:focus, .search input:focus-visible { outline: 0; box-shadow: none; }
  .search input { caret-color: var(--ink); }
  .search input::selection { background: rgba(255,255,255,.22); color: var(--ink); }
  body.no-search .search { display: none; }
  body.no-search main { padding-top: 40px; }

  /* settings */
  .gear {
    position: fixed; right: 18px; bottom: 18px; z-index: 20;
    width: 42px; height: 42px; border-radius: 10px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
    display: grid; place-items: center;
  }
  .gear:hover { color: var(--ink); }
  .gear svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #aaa; outline-offset: 2px; }

  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 30; width: min(340px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform .22s ease;
    overflow-y: auto; padding: 22px 22px 30px;
  }
  #panel.open { transform: none; }
  #panel header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  #panel h2 { font-size: 1.1rem; font-weight: 600; }
  #panel h3 { font-size: .85rem; font-weight: 500; color: var(--dim); margin: 26px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .x { background: none; border: 0; color: var(--dim); font-size: 22px; cursor: pointer; line-height: 1; }
  .x:hover { color: var(--ink); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 34px; font-size: .92rem; }
  .row.col { flex-direction: column; align-items: stretch; gap: 6px; padding: 6px 0; }
  .row .val { color: var(--dim); font-variant-numeric: tabular-nums; }
  .row .top { display: flex; justify-content: space-between; }
  #panel input[type=text], #panel input[type=password], #panel select {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: #121212; color: var(--ink); font: inherit; font-size: .9rem;
  }
  #panel input[type=range] { width: 100%; accent-color: var(--accent); }
  .sw { appearance: none; flex: none; width: 36px; height: 20px; border-radius: 10px; background: #3a3a3a; position: relative; cursor: pointer; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #bbb; transition: translate .15s, background .15s; }
  .sw:checked { background: var(--accent); }
  .sw:checked::after { translate: 16px 0; background: #1a1a1a; }
  .hint { font-size: .8rem; color: var(--dim); line-height: 1.5; margin-top: 8px; }
  .hint a { color: var(--ink); }
  .reset { margin-top: 22px; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--ink); font: inherit; cursor: pointer; }
  .reset:hover { background: #222; }

  .clock { position: absolute; top: 24px; left: 30px; z-index: 4; }
  .hi, .date, .wx { color: var(--dim); font-size: .9rem; }
  .time { font-size: calc(2.1rem * var(--cz)); font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .links { position: absolute; bottom: 24px; left: 50%; translate: -50% 0; z-index: 4; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 60vw; }
  .links a { width: calc(var(--ls) + 24px); display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; font-size: .72rem; text-align: center; }
  .links a span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  .links a:hover span:last-child { color: var(--ink); }
  .ic { width: var(--ls); height: var(--ls); border-radius: 12px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.08); display: grid; place-items: center; font-weight: 600; font-size: 1.1rem; }
  .ic img { width: calc(var(--ls) * .52); height: calc(var(--ls) * .52); }
  .notes { position: absolute; bottom: 24px; left: 30px; width: var(--nw); z-index: 4; }
  .notes textarea { width: 100%; height: var(--nh); resize: none; padding: 10px 12px; border-radius: 10px; background: rgba(18,18,18,var(--no)); border: 1px solid #3a3a3a; color: var(--ink); font: inherit; font-size: .85rem; line-height: 1.45; }
  .notes textarea:focus { outline: 0; border-color: #777; }
  .recent { list-style: none; padding: 0; margin-top: 24px; font-size: .85rem; color: var(--dim); }
  .recent li { padding: 4px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.no-clock .clock, body.no-links .links, body.no-notes .notes, body.no-recent .recent { display: none; }
  #panel input[type=color] { width: 44px; height: 30px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: #121212; cursor: pointer; }
  .mini { display: flex; gap: 8px; margin-top: 8px; }
  .mini input { flex: 1; min-width: 0; }
  .two { display: flex; gap: 10px; margin-top: 22px; }
  .two .reset { margin-top: 0; }

  /* 3D scene, effects, layout */
  .scene { perspective: var(--persp); flex: none; }
  .deck { transform-style: preserve-3d; will-change: transform; }
  .sleeve { translate: 0 0 calc(var(--depth) * 1px); }
  .disc { translate: 0 0 calc(var(--depth) * -1px); }
  .sleeve::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(circle at var(--gx, 30%) var(--gy, 20%), rgba(255,255,255,calc(var(--gloss) * .4)), transparent 60%);
  }
  .fx { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,var(--vig)) 100%); }
  .fx::after {
    content: ""; position: absolute; inset: 0; opacity: var(--grain); mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  body[data-layout=flip] main { flex-direction: row-reverse; }
  body[data-layout=stack] main { flex-direction: column; text-align: center; }
  body[data-align=center] .info { text-align: center; }
  .grp { border-bottom: 1px solid var(--line); }
  .grp summary { cursor: pointer; list-style: none; font-size: .85rem; color: var(--dim); padding: 14px 0 10px; }
  .grp[open] summary { color: var(--ink); }
  .grp[open] { padding-bottom: 10px; }

  /* rotation cues, CD, search extras */
  .record::before { content: ""; position: absolute; pointer-events: none; opacity: 0; }
  body[data-mark=dot] .record::before { opacity: 1; left: 50%; top: 4.5%; width: 2.6%; aspect-ratio: 1; translate: -50% 0; border-radius: 50%; background: rgba(255,255,255,var(--mk)); }
  body[data-mark=line] .record::before { opacity: 1; left: 50%; top: 3%; width: .9%; height: 28%; translate: -50% 0; border-radius: 2px; background: linear-gradient(rgba(255,255,255,var(--mk)), transparent); }
  .record::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 0deg, transparent 0 6%, rgba(255,255,255,var(--sp)) 10%, transparent 17%, transparent 50%, rgba(255,255,255,var(--sp)) 60%, transparent 67%); }
  .label { z-index: 1; }
  .sheen { opacity: var(--shine); }
  body.cd .record::before, body.cd .record::after, body.cd .label::after { display: none; }
  body.cd .record {
    background:
      repeating-radial-gradient(circle, rgba(255,255,255,0) 0, rgba(255,255,255,.12) 4px, rgba(255,255,255,0) 8px),
      conic-gradient(from 20deg, rgba(255,60,140,.22), rgba(255,210,60,.18), rgba(60,230,170,.22), rgba(60,140,255,.24), rgba(190,70,255,.22), rgba(255,60,140,.22)),
      conic-gradient(#d8dce4, #f6f7fb 12%, #a9b1c0 25%, #eceff4 38%, #9aa3b4 50%, #f8f9fc 62%, #b4bccb 75%, #eef0f5 88%, #d8dce4);
    -webkit-mask: radial-gradient(circle, transparent 0 6.4%, #000 6.8%); mask: radial-gradient(circle, transparent 0 6.4%, #000 6.8%);
    filter: hue-rotate(var(--cdh));
  }
  body.cd .label { background-color: #cfd3da; box-shadow: 0 0 0 .9vmin rgba(255,255,255,.35); }
  body.cd-solo .deck { width: var(--s); } body.cd-solo .disc { left: 0; }
  body.cd.cdc-off .sleeve { display: none; }
  body.cd-corner .sleeve { width: calc(var(--s) * var(--cs)); height: calc(var(--s) * var(--cs)); }
  body.cd-corner[data-cpos=tl] .sleeve { inset: -5% auto auto -5%; }
  body.cd-corner[data-cpos=tr] .sleeve { inset: -5% -5% auto auto; }
  body.cd-corner[data-cpos=bl] .sleeve { inset: auto auto -5% -5%; }
  body.cd-corner[data-cpos=br] .sleeve { inset: auto -5% -5% auto; }
  body[data-spos=bottom] .search { top: auto; bottom: 110px; }
  body[data-spos=bottom] .sug { top: auto; bottom: calc(100% + 6px); }
  body[data-clock=tr] .clock { left: auto; right: 30px; text-align: right; }
  .sug { display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: rgba(26,26,26,.96); border: 1px solid #3a3a3a; border-radius: var(--sr); overflow: hidden; }
  .si { padding: 10px 16px; font-size: .95rem; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .si.h { color: var(--dim); }
  .si.on, .si:hover { background: rgba(255,255,255,.09); }

  /* visualizer, particles, widgets, extras */
  #fxp { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  #vizbox { position: absolute; left: calc(var(--vx, 50) * 1%); top: calc(var(--vy, 78) * 1%); width: calc(var(--vw, 56) * 1vw); height: var(--vh, 110px); translate: -50% -50%; z-index: 0; pointer-events: none; }
  #viz { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #vizh { display: none; position: absolute; right: -7px; bottom: -7px; width: 14px; height: 14px; border-radius: 50%; background: #fff; opacity: .85; cursor: nwse-resize; }
  body.viz-edit #vizbox { z-index: 6; pointer-events: auto; cursor: move; outline: 1px dashed rgba(255,255,255,.55); background: rgba(255,255,255,.04); touch-action: none; }
  body.viz-edit #vizh { display: block; }
  body.no-viz #vizbox, body.no-fxp #fxp { display: none; }
  .widgets { position: absolute; top: 24px; right: 30px; width: 230px; display: flex; flex-direction: column; gap: 10px; z-index: 4; }
  .w { background: rgba(18,18,18,var(--wo, .6)); border-radius: 12px; padding: 12px 14px; font-size: .85rem; }
  .wt { color: var(--dim); font-size: .75rem; margin-bottom: 6px; }
  .big { font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sm { color: var(--dim); font-size: .8rem; line-height: 1.45; }
  .wb { display: flex; gap: 6px; margin-top: 8px; }
  .w button { flex: 1; padding: 6px; border-radius: 7px; border: 1px solid #3a3a3a; background: none; color: var(--ink); font: inherit; cursor: pointer; }
  .w ul { list-style: none; padding: 0; } .w li { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .w li span { flex: 1; } .w li.d span { text-decoration: line-through; opacity: .5; }
  .w li button { flex: none; width: 22px; padding: 0; border: 0; color: var(--dim); }
  .w input[type=text] { width: 100%; margin-top: 6px; padding: 6px 8px; border-radius: 7px; border: 1px solid #3a3a3a; background: rgba(0,0,0,.25); color: var(--ink); font: inherit; outline: 0; }
  .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; margin: 4px 0 8px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: .75rem; }
  .cal b { color: var(--dim); font-weight: 500; } .cal .t { background: var(--accent); color: #111; border-radius: 50%; }
  body.hide-pomo #w-pomo, body.hide-todo #w-todo, body.hide-cd #w-cd, body.hide-wc #w-wc, body.hide-year #w-yr, body.hide-cal #w-cal, body.hide-quote #w-q { display: none; }
  .search, .clock, .links, .notes, .widgets, .gear { transition: opacity .5s; }
  body.ui-hide .search, body.ui-hide .clock, body.ui-hide .links, body.ui-hide .notes, body.ui-hide .widgets, body.ui-hide .gear { opacity: 0; pointer-events: none; }
  body.lh .links a { transition: transform .15s; } body.lh .links a:hover { transform: scale(1.18); }
  body.tl h1 { cursor: pointer; } body.tl h1:hover { text-decoration: underline; text-underline-offset: 6px; }
  .eq { display: none; width: 14px; height: 12px; align-items: flex-end; gap: 2px; margin-right: 8px; vertical-align: -1px; }
  body.eq-on:not(.idle) .eq { display: inline-flex; }
  .eq i { flex: 1; background: var(--accent); animation: eqb .9s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
  @keyframes eqb { from { height: 20%; } to { height: 100%; } }
  body.bg-anim .bg { animation: drift 40s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: scale(1.15) rotate(3deg); } }
  #panel input[type=date] { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: #121212; color: var(--ink); font: inherit; color-scheme: dark; }
  @media (max-width: 760px) { .widgets { display: none; } }

  @media (max-width: 760px) {
    main { --s: min(56vw, 290px); flex-direction: column; text-align: center; gap: 36px; padding: 170px 24px 130px; }
    .search { top: 84px; } .notes, .recent { display: none; } .clock { left: 18px; top: 18px; } .time { font-size: 1.6rem; } .links { max-width: 92vw; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="gamma" color-interpolation-filters="sRGB">
    <feComponentTransfer>
      <feFuncR type="gamma" exponent="1"/><feFuncG type="gamma" exponent="1"/><feFuncB type="gamma" exponent="1"/>
    </feComponentTransfer>
  </filter>
</svg>

<div id="page">
  <div class="bg" id="bg"></div>
  <div class="veil" id="veil"></div>
  <div class="fx"></div>
  <div id="vizbox"><canvas id="viz"></canvas><i id="vizh"></i></div><canvas id="fxp"></canvas>

  <form class="search" id="search" role="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="text" autocomplete="off" spellcheck="false" autofocus aria-label="Search">
    <div class="sug" id="sug"></div>
  </form>

  <div class="clock"><div class="hi" id="hi"></div><div class="time" id="time"></div><div class="date" id="date"></div><div class="wx" id="wx"></div></div>
  <nav class="links" id="links"></nav>
  <div class="notes"><textarea id="note" placeholder="Notes" spellcheck="false" aria-label="Notes"></textarea></div>
  <div class="widgets" id="widgets">
    <div class="w" id="w-pomo"><div class="wt">Focus timer</div><div class="big" id="pt">25:00</div><div class="wb"><button id="pgo">Start</button><button id="prs">Reset</button></div></div>
    <div class="w" id="w-todo"><div class="wt">To-do</div><ul id="tl"></ul><input type="text" id="ti" placeholder="Add a task" autocomplete="off"></div>
    <div class="w" id="w-cd"><div class="wt" id="cdn"></div><div class="big" id="cdv"></div></div>
